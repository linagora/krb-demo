# Copy to inventory.yml. Every machine is a fresh Debian 13.
all:
  children:
    # Exactly one: directory, KDC, SSO and console.
    domain_controller:
      hosts:
        coruscant:
          ansible_host: 192.0.2.10
          ansible_user: debian
          ansible_become: true
    # Exactly one: the Rudder server, which manages the workstations'
    # configuration. A fresh Debian 13 (12 works too).
    rudder_server:
      hosts:
        kamino:
          ansible_host: 192.0.2.11
          ansible_user: debian
          ansible_become: true
          # The workstations' network: the server refuses agents from others.
          sw_rudder_allowed_networks: ["192.0.2.0/24"]
    # Linux PCs joined to the domain (see docs/workstation.md).
    workstations:
      hosts:
        tatooine:
          ansible_host: 192.0.2.21
          ansible_user: debian
          ansible_become: true
          # false: no desktop, command line only.
          sw_workstation_desktop: true
