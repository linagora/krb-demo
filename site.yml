- name: Star Wars domain controller
  hosts: domain_controller
  roles:
    - common
    - openldap
    - kerberos
    - demo_data
    - posix
    - computers
    - reverse_proxy
    - lemonldap
    - directory_manager

- name: Rudder server
  hosts: rudder_server
  pre_tasks:
    - name: Gather the domain controller's network facts
      ansible.builtin.setup:
        gather_subset: [network]
      delegate_to: "{{ groups['domain_controller'][0] }}"
      delegate_facts: true
      run_once: true
  roles:
    - rudder_server

- name: Workstations joined to the domain
  hosts: workstations
  pre_tasks:
    # sw_dc_address defaults to an address of the domain controller's facts,
    # which a run limited to workstations has not gathered.
    - name: Gather the domain controller's network facts
      ansible.builtin.setup:
        gather_subset: [network]
      delegate_to: "{{ groups['domain_controller'][0] }}"
      delegate_facts: true
      run_once: true
  roles:
    - workstation
    - role: rudder_agent
      when: groups['rudder_server'] | default([]) | length > 0
