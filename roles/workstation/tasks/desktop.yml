# Cloud images run a kernel without display drivers: no /dev/dri, no seat
# with a screen, nothing for the login screen to show on.
- name: Install the standard kernel
  ansible.builtin.apt:
    name: linux-image-amd64

- name: Remove the cloud kernel
  ansible.builtin.apt:
    name: ["linux-image-cloud-amd64", "linux-image-*-cloud-amd64"]
    state: absent
    purge: true

- name: Set the console keyboard layout
  ansible.builtin.template:
    src: keyboard.j2
    dest: /etc/default/keyboard
    mode: "0644"

- name: Create the Xorg drop-in directory
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d
    state: directory
    mode: "0755"

# Xorg reads /etc/default/keyboard only through keyboard-configuration's udev
# rules; this works without them, for the login screen too.
- name: Set the desktop keyboard layout
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/00-keyboard.conf
    content: |
      # Generated by Ansible.
      Section "InputClass"
          Identifier "system-keyboard"
          MatchIsKeyboard "on"
          Option "XkbLayout" "{{ sw_keyboard_layout }}"
      {% if sw_keyboard_variant %}
          Option "XkbVariant" "{{ sw_keyboard_variant }}"
      {% endif %}
      EndSection
    mode: "0644"
  register: sw_xkb

- name: Install the desktop
  ansible.builtin.apt:
    name:
      - dbus-x11
      - firefox-esr
      - lightdm
      - lightdm-gtk-greeter
      - xfce4
      - xfce4-screensaver
      - xfce4-terminal
      - xserver-xorg-core
      - xserver-xorg-input-libinput
      - fonts-dejavu
    install_recommends: false

- name: Create the login screen's drop-in directory
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    mode: "0755"

# Domain users are not listed: the greeter asks for a login.
- name: Configure the login screen
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf.d/50-star-wars.conf
    content: |
      # Generated by Ansible.
      [Seat:*]
      greeter-hide-users=true
      greeter-show-manual-login=true
      allow-guest=false
      user-session=xfce
    mode: "0644"

# Firefox's policies (the demo CA, Kerberos SSO on the domain's sites,
# bookmarks) are handed out by Rudder: see rudder/templates/. The directory is
# the one it writes into.
- name: Create the Firefox policy directory
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"

- name: Enable the login screen
  ansible.builtin.systemd_service:
    name: lightdm
    enabled: true

# From the running kernel, not from the tasks above: a run that stopped
# between them and here still reboots.
- name: Boot the standard kernel
  ansible.builtin.reboot:
  when: ansible_facts.kernel is search('cloud')

- name: Start the login screen
  ansible.builtin.systemd_service:
    name: lightdm
    state: "{{ 'restarted' if sw_xkb.changed else 'started' }}"

# What shows the desktop's settings (wallpaper, screen saver) is restarted when
# Rudder changes their files: the command and the units that do it are handed
# out by Rudder too (directive star-wars-desktop-refresh).
