- name: Debian 13 only
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
    fail_msg: This playbook targets Debian 13 (trixie).

- name: Set the host name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# The workstations, so that they reach each other by name (SSH with a ticket
# asks for host/<name>), and one line per service: the first name of a line
# is the canonical one, and Firefox asks for a Kerberos ticket for the
# canonical name (HTTP/auth..., not HTTP/coruscant...).
- name: Resolve the machine and the domain controller
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "# {mark} star wars demo"
    block: |
      {% for pc in groups['workstations'] %}
      {{ hostvars[pc].sw_workstation_address | default(hostvars[pc].ansible_facts.default_ipv4.address | default(hostvars[pc].ansible_host)) }} {{ pc }}.{{ sw_domain }} {{ pc }}
      {% endfor %}
      {{ sw_dc_address }} {{ sw_fqdn }} {{ sw_hostname }}
      {{ sw_dc_address }} {{ sw_portal_host }}
      {{ sw_dc_address }} {{ sw_manager_host }}
      {{ sw_dc_address }} {{ sw_directory_host }}
      {% for srv in groups['rudder_server'] | default([]) %}
      {{ hostvars[srv].sw_rudder_address | default(hostvars[srv].ansible_host) }} {{ srv }}.{{ sw_domain }} {{ srv }}
      {% endfor %}
  loop:
    - /etc/hosts
    # cloud-init rewrites /etc/hosts at boot on cloud images.
    - /etc/cloud/templates/hosts.debian.tmpl
  failed_when: false

- name: List the installed packages
  ansible.builtin.package_facts:

- name: Preseed the Kerberos client
  ansible.builtin.debconf:
    name: krb5-config
    question: krb5-config/default_realm
    vtype: string
    value: "{{ sw_realm }}"
  when: "'krb5-config' not in ansible_facts.packages"

- name: Install the domain client
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - krb5-user
      - ldap-utils
      - libnss-sss
      - libpam-sss
      - sssd
      - sssd-krb5
      - sssd-ldap
      - sssd-tools
    update_cache: true
    cache_valid_time: 3600

# Trust

- name: Read the demo CA on the domain controller
  ansible.builtin.slurp:
    src: "{{ sw_etc }}/pki/ca.crt"
  delegate_to: "{{ sw_dc }}"
  register: sw_ca_cert

- name: Trust the demo CA
  ansible.builtin.copy:
    content: "{{ sw_ca_cert.content | b64decode }}"
    dest: /usr/local/share/ca-certificates/star-wars-demo-ca.crt
    mode: "0644"
  register: sw_ca_trust

- name: Look for the demo CA in the trust store
  ansible.builtin.stat:
    path: /etc/ssl/certs/star-wars-demo-ca.pem
  register: sw_ca_trusted

- name: Update the trust store
  ansible.builtin.command: update-ca-certificates
  when: sw_ca_trust.changed or not sw_ca_trusted.stat.exists
  changed_when: true

# Kerberos: the realm, and the machine's own principal. Its key lets sssd
# check that the tickets it gets come from the real KDC; the domain
# controller disables it with the computer, which stops every login here.

- name: Write the Kerberos configuration
  ansible.builtin.template:
    src: "{{ role_path }}/../kerberos/templates/krb5.conf.j2"
    dest: /etc/krb5.conf
    mode: "0644"

- name: Install the join command
  ansible.builtin.template:
    src: star-wars-join.j2
    dest: /usr/local/sbin/star-wars-join
    mode: "0755"

# The computer in the directory: the console shows it, and the domain
# controller keeps its principal in step with it. Left alone once there.
- name: Declare the computer in the directory
  community.general.ldap_entry:
    server_uri: ldapi:///
    sasl_class: external
    dn: "{{ sw_computer_dn }}"
    objectClass: [top, device, twakeWhitePages, demoWorkstation]
    attributes:
      description: Joined by Ansible
      twakeDepartmentLink: "{{ sw_workstation_org_dn }}"
      twakeDepartmentPath: "{{ sw_workstation_organization or 'organization' }}"
      twakeAccountStatus: "cn=active,ou=twakeAccountStatus,ou=nomenclature,{{ sw_ldap_base }}"
      # Set by the reconciler too, but the join password comes before it runs.
      pwdPolicySubentry: "cn=computer,ou=policies,{{ sw_ldap_base }}"
  delegate_to: "{{ sw_dc }}"

# Machines joined before the computers role have an unmarked principal, which
# the domain controller would neither disable nor delete with the computer.
- name: Read the machine's principal
  ansible.builtin.command: kadmin.local -q "getprinc {{ sw_host_principal }}"
  delegate_to: "{{ sw_dc }}"
  register: sw_host_princ
  changed_when: false

- name: Hand the machine's principal over to the console
  ansible.builtin.command: kadmin.local -q "modprinc -policy {{ sw_computer_krb_policy }} {{ sw_host_principal }}"
  delegate_to: "{{ sw_dc }}"
  when:
    - "'Principal: ' in sw_host_princ.stdout"
    - "('Policy: ' ~ sw_computer_krb_policy) not in sw_host_princ.stdout"
  changed_when: true

- name: Read the computer's state
  ansible.builtin.command: >-
    ldapsearch -LLL -Q -o ldif-wrap=no -Y EXTERNAL -H ldapi:/// -b {{ sw_computer_dn }} -s base twakeAccountStatus
  delegate_to: "{{ sw_dc }}"
  register: sw_computer_state
  changed_when: false

- name: Check the machine's key against the KDC
  ansible.builtin.command: kinit -k -c MEMORY:join {{ sw_host_principal }}
  register: sw_joined
  changed_when: false
  failed_when: false

# Its key is refused because an administrator disabled it: joining again
# would be refused too, and is not the playbook's call.
- name: Leave a disabled computer alone
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is disabled in the console: not joined again."
  when:
    - sw_joined.rc != 0
    - "'cn=active,' not in sw_computer_state.stdout"

# Joining as anyone would: a one-time password on the computer, then the join
# command, which trades it for the keytab.
- name: Join the domain
  when:
    - sw_joined.rc != 0
    - "'cn=active,' in sw_computer_state.stdout"
  block:
    - name: Draw a one-time join password
      ansible.builtin.set_fact:
        sw_join_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
      no_log: true

    - name: Set it on the computer
      ansible.builtin.command:
        cmd: ldappasswd -Q -Y EXTERNAL -H ldapi:/// -T /dev/stdin {{ sw_computer_dn }}
        stdin: "{{ sw_join_password }}"
        stdin_add_newline: false
      delegate_to: "{{ sw_dc }}"
      changed_when: true
      no_log: true

    - name: Join with it
      ansible.builtin.command: /usr/local/sbin/star-wars-join {{ inventory_hostname }}
      environment:
        STAR_WARS_JOIN_PASSWORD: "{{ sw_join_password }}"
      changed_when: true
      no_log: true
      notify: Restart sssd

# Identities from the directory, passwords from the KDC.

- name: Configure sssd
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    # What sssd sets back at start (it runs as the sssd user since 2.10).
    mode: "0640"
  diff: false
  notify: Restart sssd

- name: Read the PAM session stack
  ansible.builtin.slurp:
    src: /etc/pam.d/common-session
  register: sw_pam_session

- name: Create home directories at first login
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  when: "'pam_mkhomedir' not in (sw_pam_session.content | b64decode)"
  changed_when: true

- name: Start sssd
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true

# SSH: Kerberos tickets from another machine of the domain, or the password.
# Named to come before cloud-init's drop-in, which turns passwords off: sshd
# keeps the first value it reads.
- name: Let domain users in over SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-star-wars.conf
    content: |
      # Generated by Ansible.
      GSSAPIAuthentication yes
      PasswordAuthentication yes
    mode: "0644"
  notify: Reload sshd

- name: Set up the desktop
  ansible.builtin.import_tasks: desktop.yml
  when: sw_workstation_desktop | bool
